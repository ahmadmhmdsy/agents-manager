<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strides · Onboarding (iOS HIG)</title>
  <style>
    :root {
      --color-bg: #F2F2F7;
      --color-surface: #FFFFFF;
      --color-ink: #000000;
      --color-ink-2: #3C3C43;
      --color-ink-3: #8E8E93;
      --color-line: rgba(60,60,67,0.12);
      --color-accent: #007AFF;
      --color-green: #34C759;
      --fs-display: 32px;
      --fs-body: 17px;
      --fs-caption: 13px;
      --lh-body: 1.4;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px;
      --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
      --frame-w: 390px; --frame-h: 844px;
    }
    body { background: #2a2a2a; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; margin: 0; padding: 40px; }
    .canvas { display: grid; grid-template-columns: repeat(auto-fit, minmax(var(--frame-w), 1fr)); gap: 40px; max-width: 980px; margin: 0 auto; }
    .screen-block { display: flex; flex-direction: column; gap: 12px; }
    .screen-label { color: #aaa; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
    .phone { width: var(--frame-w); height: var(--frame-h); background: var(--color-bg); border-radius: 40px; position: relative; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5); }
    .phone-frame { position: absolute; inset: 0; border-radius: 40px; border: 1px solid rgba(0,0,0,0.06); pointer-events: none; }
    .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 2; }
    .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 15px; font-weight: 600; color: var(--color-ink); z-index: 1; }
    .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--color-ink); opacity: 0.4; }
    .screen { position: absolute; inset: 0; overflow: hidden; background: var(--color-bg); color: var(--color-ink); display: flex; flex-direction: column; }
    .ltr { direction: ltr; unicode-bidi: embed; }

    /* Welcome screen */
    .welcome-hero { flex: 1; background: linear-gradient(180deg, #E5F0FF 0%, var(--color-bg) 100%); display: flex; align-items: center; justify-content: center; }
    .welcome-glyph { width: 120px; height: 120px; border-radius: 30px; background: var(--color-accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px -10px rgba(0,122,255,0.4); }
    .welcome-text { padding: 0 var(--space-6) 100px; text-align: center; }
    .welcome-cta { padding: var(--space-4) var(--space-5) var(--space-6); background: var(--color-bg); }
    .btn-primary { width: 100%; padding: 16px; border-radius: var(--r-md); background: var(--color-accent); color: #fff; border: none; font: inherit; font-size: var(--fs-body); font-weight: 600; }
    .large-title { font-size: var(--fs-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin: 0; }
    .subhead { font-size: var(--fs-body); color: var(--color-ink-2); line-height: var(--lh-body); margin: var(--space-3) 0 0; }

    /* Goal screen */
    .nav-bar { padding: 60px var(--space-5) var(--space-2); display: flex; align-items: center; justify-content: space-between; }
    .nav-bar .chevron { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
    .goal-body { flex: 1; padding: 0 var(--space-5); overflow-y: auto; }
    .goal-title { font-size: var(--fs-display); font-weight: 700; letter-spacing: -0.02em; margin: var(--space-2) 0 var(--space-2); }
    .goal-sub { font-size: var(--fs-body); color: var(--color-ink-2); margin: 0 0 var(--space-5); }
    .segmented { background: rgba(118,118,128,0.12); border-radius: 9px; padding: 2px; display: flex; margin-bottom: var(--space-5); }
    .segmented > div { flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; font-size: var(--fs-caption); font-weight: 600; color: var(--color-ink); }
    .segmented > div.on { background: var(--color-surface); box-shadow: 0 3px 8px rgba(0,0,0,0.04); }
    .goal-list { background: var(--color-surface); border-radius: var(--r-md); overflow: hidden; }
    .goal-row { padding: 14px var(--space-4); display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--color-line); }
    .goal-row:last-child { border-bottom: none; }
    .goal-row.selected { background: var(--color-accent); color: #fff; }
    .goal-row .label { font-size: var(--fs-body); }
    .goal-row .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; opacity: 0.3; }
    .goal-row.selected .radio { opacity: 1; background: #fff; border-color: #fff; }
    .goal-row.selected .radio::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--color-accent); }
    .goal-cta { padding: var(--space-4) var(--space-5) var(--space-6); background: var(--color-bg); border-top: 0.5px solid var(--color-line); }
  </style>
</head>
<body>
  <div class="canvas">
    <!-- Screen 1: Welcome -->
    <div class="screen-block">
      <div class="screen-label">01 · Welcome</div>
      <div class="phone">
        <div class="phone-frame"></div>
        <div class="dynamic-island"></div>
        <div class="status-bar">
          <span class="ltr">9:41</span>
          <span class="icons ltr">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="2" height="4"/><rect x="4" y="6" width="2" height="6"/><rect x="8" y="3" width="2" height="9"/><rect x="12" y="0" width="2" height="12"/></svg>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M1 5 C4 1, 10 1, 13 5"/><path d="M3 7 C5 4, 9 4, 11 7"/><circle cx="7" cy="8" r="1" fill="currentColor"/></svg>
            <svg width="22" height="10" viewBox="0 0 22 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="1" width="18" height="8" rx="2"/><rect x="3" y="3" width="13" height="4" fill="currentColor"/><rect x="20" y="3" width="2" height="4" fill="currentColor"/></svg>
          </span>
        </div>
        <div class="screen">
          <div class="welcome-hero">
            <div class="welcome-glyph">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="13" cy="4" r="2"/>
                <path d="M5 22l4-7 4 2 3-5"/>
                <path d="M9 12l3-3 3 2 3-3"/>
              </svg>
            </div>
          </div>
          <div class="welcome-text">
            <h1 class="large-title">Welcome to Strides</h1>
            <p class="subhead">Track your runs, hit your weekly goals, and run further than last week.</p>
          </div>
          <div class="welcome-cta">
            <button class="btn-primary">Get Started</button>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
    </div>

    <!-- Screen 2: Goal Picker -->
    <div class="screen-block">
      <div class="screen-label">02 · Goal Picker</div>
      <div class="phone">
        <div class="phone-frame"></div>
        <div class="dynamic-island"></div>
        <div class="status-bar">
          <span class="ltr">9:41</span>
          <span class="icons ltr">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="2" height="4"/><rect x="4" y="6" width="2" height="6"/><rect x="8" y="3" width="2" height="9"/><rect x="12" y="0" width="2" height="12"/></svg>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M1 5 C4 1, 10 1, 13 5"/><path d="M3 7 C5 4, 9 4, 11 7"/><circle cx="7" cy="8" r="1" fill="currentColor"/></svg>
            <svg width="22" height="10" viewBox="0 0 22 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="1" width="18" height="8" rx="2"/><rect x="3" y="3" width="13" height="4" fill="currentColor"/><rect x="20" y="3" width="2" height="4" fill="currentColor"/></svg>
          </span>
        </div>
        <div class="screen">
          <div class="nav-bar">
            <div class="chevron">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </div>
          </div>
          <div class="goal-body">
            <h1 class="goal-title">Set your weekly goal</h1>
            <p class="goal-sub">How far do you want to run each week?</p>
            <div class="segmented">
              <div class="on">km</div>
              <div>mi</div>
            </div>
            <div class="goal-list">
              <div class="goal-row">
                <span class="label">5 km · Easy start</span>
                <span class="radio"></span>
              </div>
              <div class="goal-row">
                <span class="label">10 km · Steady</span>
                <span class="radio"></span>
              </div>
              <div class="goal-row selected">
                <span class="label">15 km · Active</span>
                <span class="radio"></span>
              </div>
              <div class="goal-row">
                <span class="label">25 km · Ambitious</span>
                <span class="radio"></span>
              </div>
              <div class="goal-row">
                <span class="label">Custom...</span>
                <span class="radio"></span>
              </div>
            </div>
          </div>
          <div class="goal-cta">
            <button class="btn-primary">Continue</button>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
</body>
</html>
