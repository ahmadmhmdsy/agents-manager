# backfill-releases.yml — one-time backfill of historical GitHub Releases
#
# Manual trigger. Provide a comma-separated list of tags (e.g. "v0.1.0,v0.2.0")
# to create + upload ZIPs for. Leave the field empty to backfill all v* tags.
#
# Re-runnable: existing releases get notes + assets updated, not duplicated.
#
# Once the historical backfill is done, you can delete this file. Future
# releases are handled by release.yml (auto-fires on tag push).
name: backfill-releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated tag list. Empty = all v* tags.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  backfill:
    name: backfill (zip + GitHub Release per tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag list
        id: tags
        run: |
          if [[ -n "${{ inputs.tags }}" ]]; then
            echo "list=${{ inputs.tags }}" >> "$GITHUB_OUTPUT"
          else
            LIST=$(git tag -l 'v*' --sort=v:refname | tr '\n' ',' | sed 's/,$//')
            echo "list=${LIST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ZIPs
        env:
          LIST: ${{ steps.tags.outputs.list }}
        run: |
          PATHS=(
            "opencode.jsonc"
            "CLAUDE.md"
            "agents_manager"
            "share"
            "tasks"
            ".agents/skills/mavis-team"
            "bin"
          )
          IFS=',' read -ra TAGS <<< "$LIST"
          for tag in "${TAGS[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [[ -z "$tag" ]] && continue
            VERSION="${tag#v}"
            OUT="agents-manager-v${VERSION}.zip"
            echo "::group::Building ${OUT} from ${tag}"
            git archive \
              --format=zip \
              --prefix="agents-manager/" \
              --output="${OUT}" \
              "${tag}" \
              "${PATHS[@]}"
            if ! unzip -Z1 "${OUT}" | grep -qE '^agents-manager/bin/install\.sh$'; then
              echo "ERROR: ${OUT} is missing bin/install.sh"
              exit 1
            fi
            if ! unzip -Z1 "${OUT}" | grep -qE '^agents-manager/bin/install\.ps1$'; then
              echo "ERROR: ${OUT} is missing bin/install.ps1"
              exit 1
            fi
            SIZE=$(stat -c %s "${OUT}")
            ENTRIES=$(unzip -Z1 "${OUT}" | wc -l)
            echo "OK ${OUT} — size=${SIZE} bytes, entries=${ENTRIES}"
            echo "::endgroup::"
          done

      - name: Extract CHANGELOG notes
        env:
          LIST: ${{ steps.tags.outputs.list }}
        run: |
          mkdir -p /tmp/release-notes
          IFS=',' read -ra TAGS <<< "$LIST"
          for tag in "${TAGS[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [[ -z "$tag" ]] && continue
            NOTES_FILE="/tmp/release-notes/${tag}.md"
            BODY=$(sed -n "/^## ${tag} /,/^## /p" agents_manager/CHANGELOG.md | sed '$d' || true)
            if [[ -z "$BODY" ]]; then
              SUBJ=$(git tag -l --format='%(contents:subject)' "refs/tags/${tag}" 2>/dev/null | head -1)
              BODY="## ${tag}"$'\n\n'"${SUBJ}"$'\n\n_No detailed CHANGELOG entry exists for this tag. See the project CHANGELOG for newer entries._'
            fi
            echo "$BODY" > "$NOTES_FILE"
            echo "::notice title=Notes for ${tag}::$(wc -l < "$NOTES_FILE") lines"
          done

      - name: Create / update GitHub Releases
        env:
          LIST: ${{ steps.tags.outputs.list }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra TAGS <<< "$LIST"
          for tag in "${TAGS[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [[ -z "$tag" ]] && continue
            VERSION="${tag#v}"
            ZIP="agents-manager-v${VERSION}.zip"
            NOTES_FILE="/tmp/release-notes/${tag}.md"

            echo "::group::Release ${tag}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "exists — updating notes + assets"
              gh release edit "$tag" --notes-file "$NOTES_FILE"
              gh release upload "$tag" "$ZIP" --clobber
            else
              gh release create "$tag" \
                --title "$tag" \
                --notes-file "$NOTES_FILE" \
                --target "$(git rev-parse "$tag")" \
                "$ZIP"
            fi
            echo "::endgroup::"
          done