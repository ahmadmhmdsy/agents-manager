# release.yml — auto-publish a GitHub Release when a `v*` tag is pushed
#
# Trigger: any push of a tag matching `v*` (e.g. v0.9.2).
# Output: GitHub Release with the matching ZIP artifact attached, plus a
# body that links to the CHANGELOG entry.
#
# Convention:
#   $ git tag -a v0.9.2 -m "v0.9.2: short description"
#   $ git push origin v0.9.2          # workflow runs, release appears in <2 min
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated list of tags to backfill (e.g. "v0.1.0,v0.2.0"). Leave empty to release all v* tags.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: release (zip + GitHub Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git archive` works on any tag

      - name: Determine tag list
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "all=" >> "$GITHUB_OUTPUT"
          else
            INPUT='${{ inputs.tags }}'
            if [[ -n "$INPUT" ]]; then
              echo "all=${INPUT}" >> "$GITHUB_OUTPUT"
              FIRST=$(echo "$INPUT" | cut -d',' -f1)
              echo "tag=${FIRST}" >> "$GITHUB_OUTPUT"
            else
              # Empty input: release all v* tags
              TAGS=$(git tag -l 'v*' --sort=v:refname | tr '\n' ',' | sed 's/,$//')
              echo "all=${TAGS}" >> "$GITHUB_OUTPUT"
              FIRST=$(echo "$TAGS" | cut -d',' -f1)
              echo "tag=${FIRST}" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Will process: ${{ steps.tags.outputs.all }}"

      - name: Build ZIPs
        env:
          TAG_LIST: ${{ steps.tags.outputs.all }}
        run: |
          PATHS=(
            "opencode.jsonc"
            "CLAUDE.md"
            "agents_manager"
            "share"
            "tasks"
            ".agents/skills/mavis-team"
            "bin"
          )
          IFS=',' read -ra TAGS <<< "$TAG_LIST"
          for tag in "${TAGS[@]}"; do
            tag="$(echo "$tag" | xargs)"  # trim
            [[ -z "$tag" ]] && continue
            VERSION="${tag#v}"
            OUT="agents-manager-v${VERSION}.zip"
            echo "::group::Building ${OUT} from ${tag}"
            git archive \
              --format=zip \
              --prefix="agents-manager/" \
              --output="${OUT}" \
              "${tag}" \
              "${PATHS[@]}"
            if ! unzip -Z1 "${OUT}" | grep -qE '^agents-manager/bin/install\.sh$'; then
              echo "ERROR: ${OUT} is missing bin/install.sh"; exit 1
            fi
            if ! unzip -Z1 "${OUT}" | grep -qE '^agents-manager/bin/install\.ps1$'; then
              echo "ERROR: ${OUT} is missing bin/install.ps1"; exit 1
            fi
            SIZE=$(stat -c %s "${OUT}")
            ENTRIES=$(unzip -Z1 "${OUT}" | wc -l)
            echo "OK ${OUT} — size=${SIZE} bytes, entries=${ENTRIES}"
            echo "::endgroup::"
          done

      - name: Extract CHANGELOG notes per tag
        id: notes
        env:
          TAG_LIST: ${{ steps.tags.outputs.all }}
        run: |
          mkdir -p /tmp/release-notes
          for tag in $(echo "$TAG_LIST" | tr ',' ' '); do
            tag="$(echo "$tag" | xargs)"
            [[ -z "$tag" ]] && continue
            NOTES_FILE="/tmp/release-notes/${tag}.md"
            # Extract `## <tag> — ...` block from CHANGELOG.md
            BODY=$(sed -n "/^## ${tag} /,/^## /p" agents_manager/CHANGELOG.md | sed '$d' || true)
            if [[ -z "$BODY" ]]; then
              SUBJ=$(git tag -l --format='%(contents:subject)' "refs/tags/${tag}" 2>/dev/null | head -1)
              BODY="## ${tag}

${SUBJ}

_No detailed CHANGELOG entry exists for this tag. See the project CHANGELOG for newer entries._"
            fi
            echo "$BODY" > "$NOTES_FILE"
            echo "::notice title=Notes for ${tag}::$(wc -l < "$NOTES_FILE") lines"
          done

      - name: Create GitHub Releases
        env:
          TAG_LIST: ${{ steps.tags.outputs.all }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(echo "$TAG_LIST" | tr ',' ' '); do
            tag="$(echo "$tag" | xargs)"
            [[ -z "$tag" ]] && continue
            VERSION="${tag#v}"
            ZIP="agents-manager-v${VERSION}.zip"
            NOTES_FILE="/tmp/release-notes/${tag}.md"

            echo "::group::Creating release ${tag}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "${tag} already exists — updating notes + assets"
              gh release edit "$tag" --notes-file "$NOTES_FILE"
              gh release upload "$tag" "$ZIP" --clobber
            else
              gh release create "$tag" \
                --title "$tag" \
                --notes-file "$NOTES_FILE" \
                --target "$(git rev-parse "$tag")" \
                "$ZIP"
            fi
            echo "::endgroup::"
          done