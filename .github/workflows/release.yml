# release.yml — auto-publish a GitHub Release when a `v*` tag is pushed
#
# Trigger: any push of a tag matching `v*` (e.g. v0.9.2).
# Output: GitHub Release with the matching ZIP artifact attached, plus a
# body that links to the CHANGELOG entry.
#
# Convention:
#   $ git tag -a v0.9.2 -m "v0.9.2: short description"
#   $ git push origin v0.9.2          # workflow runs, release appears in <2 min
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: release (zip + GitHub Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git archive` works on any tag

      - name: Build ZIP via git archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          OUT="agents-manager-v${VERSION}.zip"
          echo "Building ${OUT} from tag ${TAG}..."

          PATHS=(
            "opencode.jsonc"
            "CLAUDE.md"
            "agents_manager"
            "share"
            "tasks"
            ".agents/skills/mavis-team"
            "bin"
          )

          git archive \
            --format=zip \
            --prefix="agents-manager/" \
            --output="${OUT}" \
            "${TAG}" \
            "${PATHS[@]}"

          # Sanity check: confirm the installer scripts are in the ZIP.
          # (Option B users invoke them from the extracted folder.)
          if ! unzip -Z1 "${OUT}" | grep -qE '^agents-manager/bin/install\.sh$'; then
            echo "ERROR: ${OUT} is missing bin/install.sh"
            exit 1
          fi
          if ! unzip -Z1 "${OUT}" | grep -qE '^agents-manager/bin/install\.ps1$'; then
            echo "ERROR: ${OUT} is missing bin/install.ps1"
            exit 1
          fi

          SIZE=$(stat -c %s "${OUT}")
          ENTRIES=$(unzip -Z1 "${OUT}" | wc -l)
          echo "OK ${OUT} — size=${SIZE} bytes, entries=${ENTRIES}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            See [CHANGELOG.md](../blob/${{ github.ref_name }}/agents_manager/CHANGELOG.md) for the full entry.

            **Install:**
            - **macOS / Linux:** `bash bin/install.sh /path/to/your-project`
            - **Windows:** `.\bin\install.ps1 -Target C:\path\to\your-project`
          files: |
            agents-manager-${{ github.ref_name }}.zip
          draft: false
          prerelease: false