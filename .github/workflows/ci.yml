name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-config:
    name: validate-config (opencode.jsonc parses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip // comments + parse opencode.jsonc
        run: |
          python3 - <<'PY'
          import re, json, sys
          p = "opencode.jsonc"
          with open(p, "r", encoding="utf-8") as f:
              raw = f.read()
          stripped = re.sub(r"(?m)^\s*//.*$", "", raw)
          try:
              data = json.loads(stripped)
          except json.JSONDecodeError as e:
              print(f"FAIL: {p} is not valid JSONC after stripping comments: {e}")
              sys.exit(1)
          agents = data.get("agent", {})
          print(f"OK: {p} parsed; agents registered: {', '.join(agents.keys())}")
          for name, cfg in agents.items():
              if "prompt" not in cfg or "permission" not in cfg:
                  print(f"FAIL: agent '{name}' missing prompt or permission")
                  sys.exit(1)
          print(f"OK: all {len(agents)} agents have prompt + permission")
          PY

  validate-frontmatter:
    name: validate-frontmatter (SKILL.md files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run frontmatter validator (all 15 SKILL.md files, v0.25.0+)
        run: |
          set -e
          python3 scripts/validate-frontmatter.py \
            agents_manager/SKILL.md \
            agents_manager/research/SKILL.md \
            agents_manager/planning/SKILL.md \
            agents_manager/coder/SKILL.md \
            agents_manager/review/SKILL.md \
            agents_manager/design/SKILL.md \
            agents_manager/assets/SKILL.md \
            agents_manager/investigate/SKILL.md \
            agents_manager/ship/SKILL.md \
            agents_manager/health/SKILL.md \
            agents_manager/extract/SKILL.md \
            agents_manager/chub-validate/SKILL.md \
            .agents/skills/mavis-team/SKILL.md \
            .agents/skills/self-reflective-prompt/SKILL.md \
            .agents/skills/verification-validation/SKILL.md

  bash-lint:
    name: bash-lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint bin/*.sh
        run: |
          set -e
          shellcheck bin/install.sh
          shellcheck bin/check.sh
          shellcheck bin/update.sh
          shellcheck bin/lint-design.sh
          shellcheck bin/agents-manager

  ps-lint:
    name: ps-lint (PowerShell syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
      - name: Syntax-check bin/*.ps1
        shell: pwsh
        run: |
          $files = @("bin/install.ps1", "bin/check.ps1", "bin/agents-manager.ps1")
          foreach ($f in $files) {
              $errs = $null
              [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errs) | Out-Null
              if ($errs.Count -gt 0) {
                  Write-Host "FAIL: $f has $($errs.Count) parse errors"
                  $errs | ForEach-Object { Write-Host "  $_" }
                  exit 1
              }
              Write-Host "OK: $f parses cleanly"
          }

  install-dryrun:
    name: install-dryrun (install.sh against /tmp/fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up git config (so install dry-run is realistic)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run install.sh into fixture
        run: |
          set -e
          FIXTURE=/tmp/am-fixture
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"
          # Ensure all shell scripts in bin/ are executable (Git on Windows
          # sometimes doesn't preserve the +x bit on checkout).
          chmod +x bin/*.sh
          ./bin/install.sh "$FIXTURE"
      - name: Verify fixture has all controller paths
        run: |
          set -e
          FIXTURE=/tmp/am-fixture
          for p in opencode.jsonc CLAUDE.md agents_manager share tasks .agents/skills/mavis-team; do
              if [[ ! -e "$FIXTURE/$p" ]]; then
                  echo "FAIL: $FIXTURE/$p missing"
                  exit 1
              fi
              echo "OK: $p present"
          done

  check-script:
    name: check-script (bin/check.sh runs without error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install required user-level skills
        run: |
          chmod +x bin/*.sh
          bash bin/agents-manager skills add --all --yes
      - name: Run bin/check.sh
        run: |
          bash bin/check.sh .

  examples-consistency:
    name: examples-consistency (all examples have required structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify each example has user-task + README + share/ or expected-output/
        run: |
          set -e
          FAIL=0
          # Every example must have README.md and user-task.md.
          # Each example should also have either share/ (worked trace) or
          # expected-output/ (compact example with end-state).
          for ex in examples/*/; do
            [[ -d "$ex" ]] || continue
            ex_name=$(basename "$ex")
            echo "Checking $ex_name/"
            for f in README.md user-task.md; do
              if [[ ! -e "$ex$f" ]]; then
                echo "  FAIL: $ex$f missing"
                FAIL=1
              else
                echo "  OK:   $ex$f"
              fi
            done
            if [[ -d "${ex}share" ]] || [[ -d "${ex}expected-output" ]]; then
              echo "  OK:   $ex_name has share/ or expected-output/"
            else
              echo "  FAIL: $ex_name missing both share/ and expected-output/ (need at least one)"
              FAIL=1
            fi
          done
          if [[ ! -f examples/README.md ]]; then
            echo "FAIL: examples/README.md missing"
            FAIL=1
          else
            echo "OK: examples/README.md"
          fi
          exit $FAIL

  validate-prompts:
    name: validate-prompts (build-prompts.py --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that opencode.jsonc specialist prompts match _GLOBAL_PROMPT.md + role addenda
        run: |
          set -e
          python3 scripts/build-prompts.py --check

  lint-design:
    name: lint-design (advisory — does not fail CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bin/lint-design.sh (advisory)
        run: |
          set -e
          chmod +x bin/lint-design.sh
          # Default path is examples/ — matches the v0.9.0 conventions.
          # Advisory: exit 0 = clean, exit 1 = violations found.
          # We do NOT fail the build on violations (skill is marked advisory).
          if bash bin/lint-design.sh examples/; then
            echo "OK: lint-design clean"
          else
            rc=$?
            if [[ $rc -eq 1 ]]; then
              echo "WARN: lint-design found violations (advisory, not failing CI)"
            else
              echo "FAIL: lint-design exited $rc"
              exit $rc
            fi
          fi
